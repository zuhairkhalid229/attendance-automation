name: Attendance

# GitHub cron is ALWAYS UTC. Local time is PKT = UTC+5.
# Check-in window ~23:00-23:40 PKT  -> 18:00 & 18:30 UTC
# Check-out window ~08:00-08:40 PKT -> 03:00 & 03:30 UTC
# Two triggers per action give redundancy: if GitHub drops/delays one, the next
# catches it. The script is idempotent (checking in when already in, or out when
# already out, is a harmless no-op), so the extra trigger never double-logs.
# On top of the cron time, the job adds a small random jitter (SPREAD_MINUTES)
# so the exact minute varies day to day. No long sleeps -> short, cheap jobs.

on:
  schedule:
    - cron: "0 18 * * *"    # check-in  (23:00 PKT)
    - cron: "30 18 * * *"   # check-in  (23:30 PKT) redundancy
    - cron: "0 3 * * *"     # check-out (08:00 PKT)
    - cron: "30 3 * * *"    # check-out (08:30 PKT) redundancy
  workflow_dispatch:
    inputs:
      action:
        description: "checkin | checkout | status"
        required: true
        default: "status"
      no_sleep:
        description: "skip the random jitter (for testing)"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # jitter is bounded well under this
    env:
      TZ: Asia/Karachi
      ATT_EMAIL: ${{ secrets.ATT_EMAIL }}
      ATT_PASSWORD: ${{ secrets.ATT_PASSWORD }}
      SPREAD_MINUTES: "20"       # action lands within 0-20 min of the cron time
      SKIP_WEEKENDS: "false"
      REPORT_TEXT: "dinenova"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Choose action
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "NO_SLEEP=${{ github.event.inputs.no_sleep }}" >> "$GITHUB_ENV"
          else
            case "${{ github.event.schedule }}" in
              "0 18 * * *"|"30 18 * * *") echo "cmd=checkin"  >> "$GITHUB_OUTPUT" ;;
              "0 3 * * *"|"30 3 * * *")   echo "cmd=checkout" >> "$GITHUB_OUTPUT" ;;
              *)                          echo "cmd=status"   >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Run
        run: python attend.py ${{ steps.pick.outputs.cmd }}
